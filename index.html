<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Murillo Brinquedos</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div id="login-area" style="text-align:center; padding: 50px 0;">
        <h2>🔐 Admin Murillo Brinquedos</h2>
        <input type="password" id="senha" placeholder="Senha Admin" style="padding: 12px; width: 200px; border-radius: 8px; border: 1px solid #ccc;">
        <button onclick="logar()" style="padding: 12px 25px; background: #e67e22; color: white; border: none; border-radius: 8px; cursor: pointer;">Entrar</button>
    </div>

    <div id="painel" class="hidden">

        <div class="grafico-box">
            <h3>📊 Lucro por Mês</h3>
            <div class="grafico-filtro">
                <label>Mostrar:</label>
                <select id="filtro-grafico" onchange="renderizarGrafico()">
                    <option value="ambos">Lucro e Total de Frete</option>
                    <option value="lucro">Somente Lucro</option>
                    <option value="frete">Somente Total de Frete</option>
                </select>
            </div>
            <canvas id="graficoLucro"></canvas>
        </div>

        <div class="filtros">
            <label><b>Filtrar por mês da festa:</b></label><br><br>
            <select id="filtro-mes" onchange="renderizarTabela()">
                <option value="todos">Todos os meses</option>
                <option value="01">Janeiro</option> <option value="02">Fevereiro</option>
                <option value="03">Março</option> <option value="04">Abril</option>
                <option value="05">Maio</option> <option value="06">Junho</option>
                <option value="07">Julho</option> <option value="08">Agosto</option>
                <option value="09">Setembro</option> <option value="10">Outubro</option>
                <option value="11">Novembro</option> <option value="12">Dezembro</option>
            </select>
        </div>

        <div class="stats">
            <div class="stat-card"><h3>Total no Mês</h3><p id="total-geral">R$ 0,00</p></div>
            <div class="stat-card"><h3>Recebido</h3><p id="total-pago" style="color: #27ae60;">R$ 0,00</p></div>
            <div class="stat-card"><h3>A Receber</h3><p id="total-pendente" style="color: #e67e22;">R$ 0,00</p></div>
            <div class="stat-card lucro"><h3>Lucro (Total - Frete)</h3><p id="total-lucro" style="color: #27ae60;">R$ 0,00</p></div>
        </div>

        <div class="tabela-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Data Festa</th>
                        <th>Cliente / Contato</th>
                        <th>Brinquedo</th>
                        <th>Valor</th>
                        <th>Frete</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
