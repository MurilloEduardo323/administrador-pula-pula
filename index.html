<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Murillo Brinquedos</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #2c3e50; padding: 20px; }
        .container { background: white; padding: 20px; border-radius: 10px; max-width: 1200px; margin: auto; }
        
        .filtros { margin-bottom: 20px; background: #f1f2f6; padding: 15px; border-radius: 8px; }
        .filtros select { padding: 8px; border-radius: 5px; border: 1px solid #ccc; font-size: 16px; }

        .stats { display: flex; gap: 20px; margin-bottom: 25px; }
        .stat-card { background: #f8f9fa; padding: 20px; border-radius: 10px; flex: 1; text-align: center; border-bottom: 4px solid #e67e22; }
        .stat-card h3 { margin: 0; color: #7f8c8d; font-size: 12px; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 20px; font-weight: bold; color: #2c3e50; }

        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #eee; padding: 12px; text-align: left; }
        th { background: #34495e; color: white; }
        .valor-celula { font-weight: bold; color: #27ae60; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="login-area" style="text-align:center; padding: 40px;">
        <h2>🔐 Acesso Admin</h2>
        <input type="password" id="senha" placeholder="Senha">
        <button onclick="logar()">Entrar</button>
    </div>

    <div id="painel" class="hidden">
        <h2>💰 Resumo Financeiro</h2>
        
        <div class="filtros">
            <label><b>Filtrar por mês: </b></label>
            <select id="filtro-mes" onchange="renderizarTabela()">
                <option value="todos">Todos os meses</option>
                <option value="01">Janeiro</option>
                <option value="02">Fevereiro</option>
                <option value="03">Março</option>
                <option value="04">Abril</option>
                <option value="05">Maio</option>
                <option value="06">Junho</option>
                <option value="07">Julho</option>
                <option value="08">Agosto</option>
                <option value="09">Setembro</option>
                <option value="10">Outubro</option>
                <option value="11">Novembro</option>
                <option value="12">Dezembro</option>
            </select>
        </div>

        <div class="stats">
            <div class="stat-card"><h3>Total Filtrado</h3><p id="total-geral">R$ 0,00</p></div>
            <div class="stat-card"><h3>Recebido</h3><p id="total-pago" style="color: #27ae60;">R$ 0,00</p></div>
            <div class="stat-card"><h3>Pendente</h3><p id="total-pendente" style="color: #e67e22;">R$ 0,00</p></div>
        </div>

        <table>
            <thead>
                <tr><th>Data Festa</th><th>Cliente</th><th>Brinquedo</th><th>Valor</th><th>Status</th></tr>
            </thead>
            <tbody id="lista"></tbody>
        </table>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDeN9rHuLrMFMjyifSVykcQc9Ixd5mSMWg",
        authDomain: "brinquedos-murillo.firebaseapp.com",
        databaseURL: "https://brinquedos-murillo-default-rtdb.firebaseio.com",
        projectId: "brinquedos-murillo",
        storageBucket: "brinquedos-murillo.firebasestorage.app",
        messagingSenderId: "98837784075",
        appId: "1:98837784075:web:922a0dac507d280bd0c90e"
    };
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    let todasReservas = []; // Variável global para guardar os dados

    function logar() {
        if(document.getElementById('senha').value === "123") {
            document.getElementById('login-area').classList.add('hidden');
            document.getElementById('painel').classList.remove('hidden');
            carregarDados();
        } else { alert("Senha errada!"); }
    }

    function carregarDados() {
        database.ref('reservas').on('value', snap => {
            todasReservas = [];
            snap.forEach(item => {
                todasReservas.push({ id: item.key, ...item.val() });
            });
            renderizarTabela();
        });
    }

    function renderizarTabela() {
        const mesSelecionado = document.getElementById('filtro-mes').value;
        const lista = document.getElementById('lista');
        lista.innerHTML = "";
        
        let somaGeral = 0, somaPago = 0, somaPendente = 0;

        todasReservas.forEach(res => {
            // Extrai o mês da data (Formato YYYY-MM-DD -> O mês é a segunda parte)
            const mesData = res.data ? res.data.split('-')[1] : null;

            // Lógica do filtro: se for "todos" ou se o mês bater, exibe
            if(mesSelecionado === "todos" || mesData === mesSelecionado) {
                const valor = parseFloat(res.valorTotal) || 0;
                somaGeral += valor;
                if(res.pago) somaPago += valor; else somaPendente += valor;

                lista.innerHTML += `
                    <tr>
                        <td><b>${formatarData(res.data)}</b></td>
                        <td>${res.cliente}</td>
                        <td>${res.brinquedo}</td>
                        <td class="valor-celula">R$ ${valor.toFixed(2)}</td>
                        <td>
                            <button class="${res.pago ? 'pago' : 'pendente'}" onclick="mudarStatus('${res.id}', ${res.pago})">
                                ${res.pago ? 'PAGO' : 'PENDENTE'}
                            </button>
                        </td>
                    </tr>`;
            }
        });

        document.getElementById('total-geral').innerText = `R$ ${somaGeral.toFixed(2)}`;
        document.getElementById('total-pago').innerText = `R$ ${somaPago.toFixed(2)}`;
        document.getElementById('total-pendente').innerText = `R$ ${somaPendente.toFixed(2)}`;
    }

    function formatarData(data) {
        if(!data) return "---";
        const partes = data.split("-");
        return `${partes[2]}/${partes[1]}/${partes[0]}`;
    }

    function mudarStatus(id, atual) { database.ref('reservas/'+id).update({ pago: !atual }); }
</script>
</body>
</html>
